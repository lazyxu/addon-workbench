name: Cleanup merged development branches

# One-time maintenance action: it runs only when this allowlist workflow is added
# or deliberately edited on master. It never deletes master or arbitrary branches.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete explicitly allowlisted merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete obsolete merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "feat/actions-sweeper-chrome-mv3"
            "feat/actions-sweeper-configurable-scan-defaults"
            "fix/actions-sweeper-filtered-pagination-cap"
            "fix/single-extract-chrome-artifact"
            "chore/cleanup-obsolete-branches"
          )

          for branch in "${branches[@]}"; do
            # Branch names are a fixed allowlist above; master is never included.
            url="https://api.github.com/repos/${GH_REPOSITORY}/git/refs/heads/${branch}"
            status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${url}")"

            case "${status}" in
              204)
                echo "Deleted merged branch: ${branch}"
                ;;
              404)
                echo "Already absent: ${branch}"
                ;;
              *)
                echo "Failed to delete ${branch} (HTTP ${status})" >&2
                cat response.json >&2
                exit 1
                ;;
            esac
          done
